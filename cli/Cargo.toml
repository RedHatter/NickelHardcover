[workspace]
resolver = "3"
members = ["macros", "qt_codegen"]

[package]
name = "nickel-hardcover-cli"
version = "0.5.3"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argh = "0.1.13"
cookie_store = "0.22.1"
graphql_client = "0.16.0"
itertools = "0.14.0"
macros = { path = "./macros" }
quick-xml = "0.40.1"
regex = "1.12.3"
retry = "2.2.0"
serde_json = "1.0.140"
serini = "0.2.0"
sfparse = "0.1.1"
zip = "8.6.0"

[dependencies.jiff]
version = "0.2.35"
features = ["serde"]

[dependencies.either]
version = "1.18.0"
features = ["serde"]

[dependencies.rusqlite]
version = "0.40.0"
features = ["bundled", "jiff"]

[dependencies.serde]
version = "1.0.219"
features = ["derive"]

[dependencies.ureq]
version = "3.3.0"
features = ["json"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
integer_division = "warn"
cast_lossless = "warn"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
